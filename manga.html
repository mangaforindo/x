<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Chapter - Manga4indo</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: #ff4757;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .back-btn {
            color: #a4b0be;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            color: #ff4757;
        }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        .chapter-item {
            background-color: #1e1e1e;
            margin-bottom: 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .chapter-item:hover {
            background-color: #2f3542;
        }

        .chapter-item a {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .page-count {
            color: #a4b0be;
            font-weight: normal;
            font-size: 14px;
            white-space: nowrap;
        }

        .loading {
            font-size: 18px;
            color: #a4b0be;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <h1 id="manga-title">Memuat Manga...</h1>
        <p style="color: #a4b0be;">Silakan pilih chapter untuk mulai membaca:</p>

        <div id="loading-status" class="loading">Mengambil daftar chapter...</div>
        <ul class="chapter-list" id="list-container"></ul>
    </div>

    <script>
        const CHAPTERS_CSV_URL =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=799183564&single=true&output=csv';

        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title') || '';
        const titleElement = document.getElementById('manga-title');
        const statusElement = document.getElementById('loading-status');
        const listContainer = document.getElementById('list-container');

        if (mangaKey) {
            titleElement.textContent = mangaKey.replace(/-/g, ' ');
        } else {
            titleElement.textContent = 'Manga tidak ditemukan';
            statusElement.textContent = 'Parameter title tidak ada di alamat halaman.';
        }

        // Membaca CSV termasuk nilai yang mengandung koma di dalam tanda kutip.
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let value = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && insideQuotes && nextChar === '"') {
                    value += '"';
                    i++;
                } else if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === ',' && !insideQuotes) {
                    row.push(value);
                    value = '';
                } else if ((char === '\n' || char === '\r') && !insideQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(value);
                    rows.push(row);
                    row = [];
                    value = '';
                } else {
                    value += char;
                }
            }

            if (value.length > 0 || row.length > 0) {
                row.push(value);
                rows.push(row);
            }

            return rows;
        }

        async function loadChapters() {
            if (!mangaKey) return;

            try {
                const response = await fetch(CHAPTERS_CSV_URL, {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`Permintaan CSV gagal (${response.status}).`);
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    throw new Error('CSV kosong atau tidak memiliki baris data.');
                }

                let foundChapter = false;

                // Baris pertama adalah header.
                // Urutan kolom data: mangaKey, chId, chName, totalPages.
                for (const columns of rows.slice(1)) {
                    if (!columns || columns.length < 4) continue;

                    const rowMangaKey = (columns[0] || '').trim();
                    const chapterId = (columns[1] || '').trim();
                    const chapterName = (columns[2] || '').trim();
                    const totalPages = (columns[3] || '').trim();

                    if (
                        !rowMangaKey ||
                        rowMangaKey.toLowerCase() !== mangaKey.toLowerCase()
                    ) {
                        continue;
                    }

                    foundChapter = true;

                    const item = document.createElement('li');
                    item.className = 'chapter-item';

                    const link = document.createElement('a');
                    const chapterUrl = new URL('baca.html', window.location.href);
                    chapterUrl.searchParams.set('title', mangaKey);
                    chapterUrl.searchParams.set('ch', chapterId);
                    chapterUrl.searchParams.set('total', totalPages || '1');
                    link.href = chapterUrl.href;

                    const name = document.createElement('span');
                    name.textContent = chapterName || chapterId;

                    const count = document.createElement('span');
                    count.className = 'page-count';
                    count.textContent = `${totalPages || '1'} Hal`;

                    link.append(name, count);
                    item.appendChild(link);
                    listContainer.appendChild(item);
                }

                if (foundChapter) {
                    statusElement.style.display = 'none';
                } else {
                    statusElement.textContent =
                        'Belum ada chapter untuk manga ini. Periksa mangaKey di Google Sheet.';
                }
            } catch (error) {
                console.error('Gagal memuat chapter:', error);
                statusElement.textContent =
                    'Gagal memuat daftar chapter. Periksa koneksi dan pengaturan publikasi Google Sheet.';
            }
        }

        loadChapters();
    </script>
</body>
</html>
