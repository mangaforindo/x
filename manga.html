<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Chapter - Manga4indo</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="manga-page-view">
    <header class="site-header"><nav class="site-nav" aria-label="Navigasi utama">
        <a class="site-brand" href="index.html">Manga4indo</a>
        <div class="site-links">
            <a href="index.html" data-page="home">Home</a>
            <a href="list.html" data-page="daftar">Daftar Manga</a>
            <a href="index.html#terbaru" data-page="terbaru">Terbaru</a>
        </div>
    </nav></header>
    <div class="container">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <section class="manga-profile" aria-label="Informasi manga">
            <img id="manga-cover" class="manga-cover" src="" alt="" hidden>
            <div class="manga-profile-copy">
                <span class="manga-kicker">Tentang manga</span>
                <h1 id="manga-title">Memuat Manga...</h1>
                <p id="manga-description" class="manga-description">Memuat informasi manga...</p>
            </div>
        </section>

        <section class="chapter-section" aria-labelledby="chapter-heading">
            <div class="chapter-section-heading">
                <div>
                    <span class="manga-kicker">Mulai membaca</span>
                    <h2 id="chapter-heading">Daftar Chapter</h2>
                </div>
                <span class="chapter-total-label">Pilih chapter</span>
            </div>
            <div id="loading-status" class="loading">Mengambil daftar chapter...</div>
        <ul class="chapter-list" id="list-container"></ul>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title');

        const mangaTitleElement = document.getElementById('manga-title');
        const mangaCoverElement = document.getElementById('manga-cover');
        const mangaDescriptionElement = document.getElementById('manga-description');
        mangaCoverElement.addEventListener('error', () => { mangaCoverElement.hidden = true; });
        if (mangaKey) {
            mangaTitleElement.textContent = mangaKey.replace(/-/g, ' ');
        }

        // Ambil judul lengkap dari kolom kedua sheet katalog berdasarkan mangaKey di kolom pertama.
        const mangaCatalogCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=0&single=true&output=csv';

        function parseCatalogCSV(text) {
            const rows = [];
            let row = [];
            let value = '';
            let quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];
                if (char === '"' && quoted && next === '"') {
                    value += '"';
                    i++;
                } else if (char === '"') {
                    quoted = !quoted;
                } else if (char === ',' && !quoted) {
                    row.push(value);
                    value = '';
                } else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(value);
                    rows.push(row);
                    row = [];
                    value = '';
                } else {
                    value += char;
                }
            }
            if (value.length || row.length) {
                row.push(value);
                rows.push(row);
            }
            return rows;
        }

        fetch(mangaCatalogCsvUrl, { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error(`Google Sheet merespons ${response.status}`);
                return response.text();
            })
            .then(csvText => {
                const catalogRows = parseCatalogCSV(csvText);
                const headers = (catalogRows[0] || []).map(value => value.replace(/^\uFEFF/, '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
                const findColumn = patterns => headers.findIndex(header => patterns.some(pattern => pattern.test(header)));
                const keyIndex = findColumn([/mangakey/, /^key$/, /slug/]);
                const titleIndex = findColumn([/judul/, /title/, /nama manga/, /^manga$/]);
                const descriptionIndex = findColumn([/deskripsi/, /sinopsis/, /description/]);
                const coverIndex = findColumn([/cover/, /sampul/, /gambar/]);
                const column = (columns, index, fallback) => (columns[index >= 0 ? index : fallback] || '').trim();
                const mangaRow = catalogRows.slice(1).find(columns => {
                    const key = column(columns, keyIndex, 0).replace(/^"|"$/g, '');
                    return mangaKey && key.toLowerCase() === mangaKey.toLowerCase();
                });
                const fullTitle = mangaRow ? column(mangaRow, titleIndex, 1) : '';
                if (fullTitle) mangaTitleElement.textContent = fullTitle;
                const coverFile = mangaRow ? column(mangaRow, coverIndex, 3) : '';
                const description = mangaRow ? column(mangaRow, descriptionIndex, 2) : '';

                if (coverFile) {
                    const coverPath = coverFile.split('/').map(encodeURIComponent).join('/');
                    mangaCoverElement.src = `covers/${coverPath}`;
                    mangaCoverElement.alt = `Sampul ${fullTitle || mangaKey}`;
                    mangaCoverElement.hidden = false;
                }

                mangaDescriptionElement.textContent = description || 'Pilih chapter di bawah untuk mulai membaca.';
            })
            .catch(error => console.warn('Judul manga lengkap tidak termuat:', error));

        // Tautan CSV milik Anda dengan pengaman bypass cache otomatis
        const chaptersCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=799183564&single=true&output=csv';

        fetch(chaptersCsvUrl)
            .then(res => {
                if (!res.ok) throw new Error("Jaringan bermasalah");
                return res.text();
            })
            .then(csvText => {
                const lines = csvText.split(/\r?\n/);
                const listContainer = document.getElementById('list-container');
                document.getElementById('loading-status').style.display = 'none';

                let foundChapter = false;

                // Loop baris data dari Google Sheet (melewati baris header ke-0)
                for (let i = 1; i < lines.length; i++) {
                    const currentLine = lines[i].trim();
                    if (!currentLine) continue;

                    const columns = currentLine.split(',');
                    if (columns.length < 4) continue;
                    
                    // SOLUSI MUTLAK: Menggunakan Object.values untuk membaca urutan kolom tanpa tanda kurung siku agar tidak terpotong AI
                    const mKey = Object.values(columns).shift().trim().replace(/^"|"$/g, '');
                    const chId = Object.values(columns).slice(1, 2).pop().trim().replace(/^"|"$/g, '');
                    const chName = Object.values(columns).slice(2, 3).pop().trim().replace(/^"|"$/g, '');
                    const totalP = Object.values(columns).slice(3, 4).pop().trim().replace(/^"|"$/g, '');

                    if (mKey && mKey.toLowerCase() === mangaKey.toLowerCase()) {
                        foundChapter = true;
                        const li = document.createElement('li');
                        li.className = 'chapter-item';
                        li.innerHTML = `
                            <a href="baca.html?title=${mangaKey}&ch=${chId}&total=${totalP}">
                                <span>${chName}</span>
                                <span class="page-count">${totalP} Hal</span>
                            </a>`;
                        listContainer.appendChild(li);
                    }
                }

                if(!foundChapter) {
                    document.getElementById('loading-status').style.display = 'block';
                    document.getElementById('loading-status').innerText = "Belum ada chapter untuk manga ini. Cek kembali Google Sheet Anda.";
                }
            })
            .catch(err => {
                console.error("Gagal memuat chapter: ", err);
                document.getElementById('loading-status').style.display = 'block';
                document.getElementById('loading-status').innerText = "Gagal memuat daftar chapter. Silakan coba muat ulang halaman.";
            });
    </script>
<script>
const f=location.pathname.split('/').pop()||'index.html';let p='home';if(f==='list.html'||f==='manga.html'||f==='baca.html')p='daftar';if(location.hash==='#terbaru')p='terbaru';document.querySelectorAll('.site-links a').forEach(a=>{if(a.dataset.page===p)a.setAttribute('aria-current','page')});
</script>
</body>
</html>
