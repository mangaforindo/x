<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Chapter - Manga4indo</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: #ff4757; text-transform: uppercase; margin-bottom: 5px; }
        .back-btn { color: #a4b0be; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px; }
        .back-btn:hover { color: #ff4757; }
        .chapter-list { list-style: none; padding: 0; margin-top: 30px; }
        .chapter-item { background-color: #1e1e1e; margin-bottom: 10px; border-radius: 6px; transition: 0.2s; }
        .chapter-item:hover { background-color: #2f3542; }
        .chapter-item a { display: flex; justify-content: space-between; padding: 15px 20px; color: white; text-decoration: none; font-weight: bold; }
        .page-count { color: #a4b0be; font-weight: normal; font-size: 14px; }
        .loading { font-size: 18px; color: #a4b0be; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <h1 id="manga-title">Memuat Manga...</h1>
        <p style="color: #a4b0be;">Silakan pilih chapter untuk mulai membaca:</p>
        
        <div id="loading-status" class="loading">Mengambil daftar chapter...</div>
        <ul class="chapter-list" id="list-container"></ul>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title');

        if(mangaKey) {
            document.getElementById('manga-title').innerText = mangaKey.replace(/-/g, ' ');
        }

        // URL Google Sheet CSV Tab Chapters Anda dengan bypass cache otomatis
        const chaptersCsvUrl = 'https://google.com' + new Date().getTime();

        // Fungsi pemisah baris CSV pintar yang kebal dari tanda koma di dalam teks teks
        function parseCSV(text) {
            let lines = text.split(/\r?\n/);
            return lines.map(line => {
                let matches = [];
                let match;
                let regex = /([^",]+)|"([^"]*)"/g;
                
                while ((match = regex.exec(line)) !== null) {
                    matches.push(match[1] || match[2] || "");
                }
                return matches.map(v => v.trim());
            });
        }

        fetch(chaptersCsvUrl)
            .then(res => res.text())
            .then(csvText => {
                const parsedData = parseCSV(csvText);
                const listContainer = document.getElementById('list-container');
                document.getElementById('loading-status').style.display = 'none';

                let foundChapter = false;

                // Loop baris data dari Google Sheet (melewati baris header ke-0)
                for (let i = 1; i < parsedData.length; i++) {
                    const rowData = parsedData[i];
                    if (rowData.length < 4) continue;

                    // Menggunakan nama variabel penunjuk langsung agar anti-error
                    const mKey = rowData[0];   // Kolom A (MangaKey)
                    const chId = rowData[1];   // Kolom B (ChapterId)
                    const chName = rowData[2]; // Kolom C (ChapterName)
                    const totalP = rowData[3]; // Kolom D (TotalPages)

                    if (mKey && mKey.toLowerCase() === mangaKey.toLowerCase()) {
                        foundChapter = true;
                        const li = document.createElement('li');
                        li.className = 'chapter-item';
                        li.innerHTML = `
                            <a href="baca.html?title=${mangaKey}&ch=${chId}&total=${totalP}">
                                <span>${chName}</span>
                                <span class="page-count">${totalP} Hal</span>
                            </a>`;
                        listContainer.appendChild(li);
                    }
                }

                if(!foundChapter) {
                    document.getElementById('loading-status').style.display = 'block';
                    document.getElementById('loading-status').innerText = "Belum ada chapter untuk manga ini. Periksa kesamaan tulisan di Google Sheets.";
                }
            })
            .catch(err => {
                console.error("Gagal memuat chapter: ", err);
                document.getElementById('loading-status').innerText = "Gagal memuat daftar chapter.";
            });
    </script>
</body>
</html>
