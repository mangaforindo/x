<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Chapter</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: #ff4757; text-transform: uppercase; margin-bottom: 5px; }
        .back-btn { color: #a4b0be; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px; }
        .back-btn:hover { color: #ff4757; }
        .chapter-list { list-style: none; padding: 0; margin-top: 30px; }
        .chapter-item { background-color: #1e1e1e; margin-bottom: 10px; border-radius: 6px; transition: 0.2s; }
        .chapter-item:hover { background-color: #2f3542; }
        .chapter-item a { display: flex; justify-content: space-between; padding: 15px 20px; color: white; text-decoration: none; font-weight: bold; }
        .page-count { color: #a4b0be; font-weight: normal; font-size: 14px; }
        .loading { font-size: 18px; color: #a4b0be; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <h1 id="manga-title">Memuat Manga...</h1>
        <p style="color: #a4b0be;">Silakan pilih chapter untuk mulai membaca:</p>
        
        <div id="loading-status" class="loading">Mengambil daftar chapter...</div>
        <ul class="chapter-list" id="list-container"></ul>
    </div>

    <script>
        // ========================================================
        // MASUKKAN ID GOOGLE SHEET ANDA DI BAWAH INI
        // ========================================================
        const SHEET_ID = '1A2B3C4D5E6F7G8H9I0J'; // <-- Ganti dengan ID Sheet Anda yang sama
        const SHEET_NAME = 'chapters';

        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title');

        // Mengatur judul utama sementara berdasarkan parameter URL
        if(mangaKey) {
            document.getElementById('manga-title').innerText = mangaKey.replace('-', ' ');
        }

        const jsonUrl = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        fetch(jsonUrl)
            .then(res => res.text())
            .then(data => {
                const jsonText = data.match(/(?<="table":).*(?=}\);)/g);
                const jsonData = JSON.parse(jsonText);
                const rows = jsonData.rows;

                const listContainer = document.getElementById('list-container');
                document.getElementById('loading-status').style.display = 'none';

                let foundChapter = false;

                rows.forEach(row => {
                    const mKey = row.c ? row.c.v : '';  // Kolom A (MangaKey)
                    const chId = row.c ? row.c.v : '';  // Kolom B (ChapterId)
                    const chName = row.c ? row.c.v : '';// Kolom C (ChapterName)
                    const totalP = row.c ? row.c.v : 1; // Kolom D (TotalPages)

                    // Hanya tampilkan chapter yang COCOK dengan manga yang dipilih
                    if (mKey === mangaKey) {
                        foundChapter = true;
                        const li = document.createElement('li');
                        li.className = 'chapter-item';
                        li.innerHTML = `
                            <a href="baca.html?title=${mangaKey}&ch=${chId}&total=${totalP}">
                                <span>${chName}</span>
                                <span class="page-count">${totalP} Hal</span>
                            </a>`;
                        listContainer.appendChild(li);
                    }
                });

                if(!foundChapter) {
                    document.getElementById('loading-status').style.display = 'block';
                    document.getElementById('loading-status').innerText = "Belum ada chapter untuk manga ini.";
                }
            })
            .catch(err => {
                console.error("Gagal mengambil data chapter: ", err);
                document.getElementById('loading-status').innerText = "Gagal memuat chapter.";
            });
    </script>
</body>
</html>
