<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Reader - Manga4indo</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --btn-home: #2f3542;
        }
        [data-theme="light"] {
            --bg-color: #f1f2f6;
            --text-color: #2f3542;
            --card-bg: #ffffff;
            --btn-home: #ced6e0;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .reader-container { max-width: 800px; margin: 0 auto; }
        .manga-page { max-width: 100%; height: auto; border: 2px solid #222; margin: 20px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
        .utility-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-buttons { margin: 25px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
        button, .dropdown-select { background-color: #ff4757; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; height: 45px; box-sizing: border-box; transition: 0.2s; }
        button:hover { background-color: #ff6b81; }
        .dropdown-select { background-color: var(--card-bg); color: var(--text-color); border: 1px solid #57606f; padding: 0 15px; min-width: 180px; }
        button:disabled { background-color: #333; color: #777; cursor: not-allowed; }
        .info { font-size: 18px; color: #a4b0be; }
        .back-link { display: block; margin-top: 15px; color: #ff4757; text-decoration: none; font-size: 15px; }
        .btn-util { background-color: var(--btn-home); color: var(--text-color); padding: 8px 15px; font-size: 14px; height: auto; }
            .site-header{position:sticky;top:0;z-index:1000;margin:-20px -20px 28px;padding:0 20px;background:rgba(18,18,18,.95);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
        .site-nav{max-width:1100px;min-height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
        .site-brand{color:#ff4757;text-decoration:none;font-size:20px;font-weight:800;white-space:nowrap}
        .site-links{display:flex;align-items:center;gap:5px}
        .site-links a{color:#a4b0be;text-decoration:none;font-size:14px;font-weight:600;padding:10px 13px;border-radius:8px;white-space:nowrap;transition:.18s}
        .site-links a:hover,.site-links a[aria-current=page]{color:#fff;background:rgba(255,71,87,.15)}
        @media(max-width:600px){.site-header{margin-bottom:20px}.site-nav{display:block;padding:9px 0}.site-brand{display:block;font-size:18px;margin:0 0 6px 4px}.site-links{overflow-x:auto;scrollbar-width:none}.site-links::-webkit-scrollbar{display:none}.site-links a{font-size:13px;padding:9px 11px}}
    </style>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <header class="site-header"><nav class="site-nav" aria-label="Navigasi utama">
        <a class="site-brand" href="index.html">Manga4indo</a>
        <div class="site-links">
            <a href="index.html" data-page="home">Home</a>
            <a href="list.html" data-page="daftar">Daftar Manga</a>
            <a href="index.html#top-manga" data-page="top">Top Manga</a>
            <a href="index.html#terbaru" data-page="terbaru">Terbaru</a>
        </div>
    </nav></header>

    <div class="reader-container">
        <!-- Bar Utilitas Atas -->
        <div class="utility-bar">
            <button class="btn-util" onclick="toggleTheme()" id="theme-btn">☀️ Light Mode</button>
        </div>

        <h2 id="display-title">Memuat...</h2>
        <div class="info">Halaman <span id="current-page">1</span> / <span id="total-pages">--</span></div>
        
        <!-- Navigasi Atas -->
        <div class="nav-buttons">
            <button class="btn-prev" onclick="changePage(-1)">◀ Prev</button>
            <select class="dropdown-select ch-dropdown" onchange="navigateChapter(this.value)"></select>
            <button class="btn-next" onclick="changePage(1)">Next ▶</button>
        </div>

        <!-- Area Gambar Utama -->
        <img id="manga-img" src="" alt="Manga Page" class="manga-page" onclick="changePage(1)">

        <!-- Navigasi Bawah -->
        <div class="nav-buttons">
            <button class="btn-prev" onclick="changePage(-1)">◀ Prev</button>
            <select class="dropdown-select ch-dropdown" onchange="navigateChapter(this.value)"></select>
            <button class="btn-next" onclick="changePage(1)">Next ▶</button>
        </div>

        <a href="#" id="back-to-list" class="back-link">← Kembali ke Daftar Chapter</a>
    </div>

    <script>
        const fileExt = '.jpg'; 
        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title') || 'dragon-ball';
        let currentChapterId = urlParams.get('ch');
        let totalPages = parseInt(urlParams.get('total')) || 1;
        let page = 1;
document.getElementById('display-title').innerText = `${mangaKey.replace(/-/g, ' ').toUpperCase()} - ${currentChapterId ? currentChapterId.replace(/-/g, ' ') : ''}`;
        document.getElementById('total-pages').innerText = totalPages;
        document.getElementById('back-to-list').href = `manga.html?title=${mangaKey}`;

        // URL CSV khusus tab chapters milik Anda dengan bypass cache otomatis
        const chaptersCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=799183564&single=true&output=csv';

        // Mengambil data untuk Dropdown Selector via CSV Google Sheets
        fetch(chaptersCsvUrl)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split(/\r?\n/);
                document.querySelectorAll('.ch-dropdown').forEach(dropdown => {
                    dropdown.innerHTML = ''; 
                    for (let i = 1; i < lines.length; i++) {
                        const currentLine = lines[i].trim();
                        if (!currentLine) continue;
                        
                        const columns = currentLine.split(',');
                        if (columns.length < 4) continue;

                        // Menggunakan metode .at() yang aman dan anti-terpotong sistem otomatis
                        const mKey = columns.at(0) ? columns.at(0).trim().replace(/^"|"$/g, '') : '';
                        const chId = columns.at(1) ? columns.at(1).trim().replace(/^"|"$/g, '') : '';
                        const chName = columns.at(2) ? columns.at(2).trim().replace(/^"|"$/g, '') : '';
                        const totalP = columns.at(3) ? columns.at(3).trim().replace(/^"|"$/g, '') : '1';

                        if (mKey && mKey.toLowerCase() === mangaKey.toLowerCase()) {
                            const option = document.createElement('option');
                            option.value = `baca.html?title=${mangaKey}&ch=${chId}&total=${totalP}`;
                            option.text = chName;
                            if(chId === currentChapterId) option.selected = true;
                            dropdown.appendChild(option);
                        }
                    }
                });
            });

        function renderPage() {
            // Mengubah ke penamaan gambar format 3 digit (001.jpg, 002.jpg, dst)
            const formattedPage = String(page).padStart(3, '0');
            document.getElementById('manga-img').src = `manga/${mangaKey}/${currentChapterId}/${formattedPage}${fileExt}`;
            document.getElementById('current-page').innerText = page;

            document.querySelectorAll('.btn-prev').forEach(btn => btn.disabled = (page === 1));
            document.querySelectorAll('.btn-next').forEach(btn => btn.disabled = (page === totalPages));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(direction) {
            page += direction;
            if (page < 1) page = 1;
            if (page > totalPages) { page = totalPages; return; }
            renderPage();
        }

        function navigateChapter(url) { window.location.href = url; }
function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = 'dark';
            if (currentTheme === 'dark' || !currentTheme) {
                targetTheme = 'light';
                document.getElementById('theme-btn').innerText = "🌙 Dark Mode";
            } else {
                targetTheme = 'dark';
                document.getElementById('theme-btn').innerText = "☀️ Light Mode";
            }
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme_preference', targetTheme);
        }

        const savedTheme = localStorage.getItem('theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if(savedTheme === 'light') document.getElementById('theme-btn').innerText = "🌙 Dark Mode";

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowLeft" && page > 1) changePage(-1);
            if (e.key === "ArrowRight" && page < totalPages) changePage(1);
        });

        renderPage();
    </script>
<script>
const f=location.pathname.split('/').pop()||'index.html';let p='home';if(f==='list.html'||f==='manga.html'||f==='baca.html')p='daftar';if(location.hash==='#top-manga')p='top';if(location.hash==='#terbaru')p='terbaru';document.querySelectorAll('.site-links a').forEach(a=>{if(a.dataset.page===p)a.setAttribute('aria-current','page')});
</script>
</body>
</html>
