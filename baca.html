<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Reader - Manga4indo</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="reader-page">
    <header class="site-header"><nav class="site-nav" aria-label="Navigasi utama">
        <a class="site-brand" href="index.html">Manga4indo</a>
        <div class="site-links">
            <a href="index.html" data-page="home">Home</a>
            <a href="list.html" data-page="daftar">Daftar Manga</a>
            <a href="index.html#terbaru" data-page="terbaru">Terbaru</a>
        </div>
    </nav></header>

    <div class="reader-container">
        <!-- Bar Utilitas Atas -->
        <div class="utility-bar">
            <button class="btn-util" onclick="toggleTheme()" id="theme-btn">☀️ Light Mode</button>
        </div>

        <h2 id="display-title">Memuat...</h2>
        <div class="info">Halaman <span id="current-page">1</span> / <span id="total-pages">--</span></div>
        
        <!-- Navigasi Atas -->
        <div class="nav-buttons">
            <button class="btn-prev" onclick="changePage(-1)">◀ Prev</button>
            <select class="dropdown-select ch-dropdown" onchange="navigateChapter(this.value)"></select>
            <button class="btn-next" onclick="changePage(1)">Next ▶</button>
        </div>

        <!-- Area Gambar Utama -->
        <img id="manga-img" src="" alt="Manga Page" class="manga-page" onclick="changePage(1)">

        <!-- Navigasi Bawah -->
        <div class="nav-buttons">
            <button class="btn-prev" onclick="changePage(-1)">◀ Prev</button>
            <select class="dropdown-select ch-dropdown" onchange="navigateChapter(this.value)"></select>
            <button class="btn-next" onclick="changePage(1)">Next ▶</button>
        </div>

        <a href="#" id="back-to-list" class="back-link">← Kembali ke Daftar Chapter</a>
    </div>

    <script>
        const fileExt = '.jpg'; 
        const urlParams = new URLSearchParams(window.location.search);
        const mangaKey = urlParams.get('title') || 'dragon-ball';
        let currentChapterId = urlParams.get('ch');
        let totalPages = parseInt(urlParams.get('total')) || 1;
        let page = 1;
        const chapterDisplayName = currentChapterId ? currentChapterId.replace(/-/g, ' ') : '';
        function setReaderTitle(title) {
            document.getElementById('display-title').textContent = `${title} - ${chapterDisplayName}`.trim();
        }
        setReaderTitle(mangaKey.replace(/-/g, ' ').toUpperCase());

        function parseCatalogCSV(text) {
            const rows = [];
            let row = [];
            let value = '';
            let quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];
                if (char === '"' && quoted && next === '"') {
                    value += '"';
                    i++;
                } else if (char === '"') {
                    quoted = !quoted;
                } else if (char === ',' && !quoted) {
                    row.push(value);
                    value = '';
                } else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(value);
                    rows.push(row);
                    row = [];
                    value = '';
                } else {
                    value += char;
                }
            }
            if (value.length || row.length) {
                row.push(value);
                rows.push(row);
            }
            return rows;
        }

        const mangaCatalogCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=0&single=true&output=csv';
        fetch(mangaCatalogCsvUrl, { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error(`Google Sheet merespons ${response.status}`);
                return response.text();
            })
            .then(csvText => {
                const mangaRow = parseCatalogCSV(csvText).slice(1).find(columns => {
                    const key = (columns[0] || '').trim().replace(/^"|"$/g, '');
                    return key.toLowerCase() === mangaKey.toLowerCase();
                });
                const fullTitle = mangaRow ? (mangaRow[1] || '').trim() : '';
                if (fullTitle) setReaderTitle(fullTitle);
            })
            .catch(error => console.warn('Judul manga lengkap tidak termuat:', error));
        document.getElementById('total-pages').innerText = totalPages;
        document.getElementById('back-to-list').href = `manga.html?title=${mangaKey}`;

        // URL CSV khusus tab chapters milik Anda dengan bypass cache otomatis
        const chaptersCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=799183564&single=true&output=csv';

        // Mengambil data untuk Dropdown Selector via CSV Google Sheets
        fetch(chaptersCsvUrl)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split(/\r?\n/);
                document.querySelectorAll('.ch-dropdown').forEach(dropdown => {
                    dropdown.innerHTML = ''; 
                    for (let i = 1; i < lines.length; i++) {
                        const currentLine = lines[i].trim();
                        if (!currentLine) continue;
                        
                        const columns = currentLine.split(',');
                        if (columns.length < 4) continue;

                        // Menggunakan metode .at() yang aman dan anti-terpotong sistem otomatis
                        const mKey = columns.at(0) ? columns.at(0).trim().replace(/^"|"$/g, '') : '';
                        const chId = columns.at(1) ? columns.at(1).trim().replace(/^"|"$/g, '') : '';
                        const chName = columns.at(2) ? columns.at(2).trim().replace(/^"|"$/g, '') : '';
                        const totalP = columns.at(3) ? columns.at(3).trim().replace(/^"|"$/g, '') : '1';

                        if (mKey && mKey.toLowerCase() === mangaKey.toLowerCase()) {
                            const option = document.createElement('option');
                            option.value = `baca.html?title=${mangaKey}&ch=${chId}&total=${totalP}`;
                            option.text = chName;
                            if(chId === currentChapterId) option.selected = true;
                            dropdown.appendChild(option);
                        }
                    }
                });
            });

        function renderPage() {
            // Mengubah ke penamaan gambar format 3 digit (001.jpg, 002.jpg, dst)
            const formattedPage = String(page).padStart(3, '0');
            document.getElementById('manga-img').src = `manga/${mangaKey}/${currentChapterId}/${formattedPage}${fileExt}`;
            document.getElementById('current-page').innerText = page;

            document.querySelectorAll('.btn-prev').forEach(btn => btn.disabled = (page === 1));
            document.querySelectorAll('.btn-next').forEach(btn => btn.disabled = (page === totalPages));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(direction) {
            page += direction;
            if (page < 1) page = 1;
            if (page > totalPages) { page = totalPages; return; }
            renderPage();
        }

        function navigateChapter(url) { window.location.href = url; }
function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = 'dark';
            if (currentTheme === 'dark' || !currentTheme) {
                targetTheme = 'light';
                document.getElementById('theme-btn').innerText = "🌙 Dark Mode";
            } else {
                targetTheme = 'dark';
                document.getElementById('theme-btn').innerText = "☀️ Light Mode";
            }
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme_preference', targetTheme);
        }

        const savedTheme = localStorage.getItem('theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if(savedTheme === 'light') document.getElementById('theme-btn').innerText = "🌙 Dark Mode";

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowLeft" && page > 1) changePage(-1);
            if (e.key === "ArrowRight" && page < totalPages) changePage(1);
        });

        renderPage();
    </script>
<script>
const f=location.pathname.split('/').pop()||'index.html';let p='home';if(f==='list.html'||f==='manga.html'||f==='baca.html')p='daftar';if(location.hash==='#terbaru')p='terbaru';document.querySelectorAll('.site-links a').forEach(a=>{if(a.dataset.page===p)a.setAttribute('aria-current','page')});
</script>
</body>
</html>
