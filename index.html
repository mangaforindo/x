<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga4indo - Baca Manga Bahasa Indonesia</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        h1 { color: #ff4757; font-size: 2.5rem; margin-bottom: 5px; }
        p.subtitle { color: #a4b0be; margin-bottom: 30px; }
        .manga-grid { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; margin-top: 20px; }
        .manga-card { width: 200px; background-color: #1e1e1e; padding: 12px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s, background-color 0.2s; text-decoration: none; color: white; text-align: left; }
        .manga-card:hover { transform: translateY(-8px); background-color: #2f3542; }
        .manga-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; }
        .manga-card h3 { margin: 12px 0 5px 0; font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .manga-card span { color: #ff4757; font-size: 13px; font-weight: 500; }
        .loading { font-size: 18px; color: #a4b0be; margin-top: 5px; }
            .site-header{position:sticky;top:0;z-index:1000;margin:-20px -20px 28px;padding:0 20px;background:rgba(18,18,18,.95);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
        .site-nav{max-width:1100px;min-height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
        .site-brand{color:#ff4757;text-decoration:none;font-size:20px;font-weight:800;white-space:nowrap}
        .site-links{display:flex;align-items:center;gap:5px}
        .site-links a{color:#a4b0be;text-decoration:none;font-size:14px;font-weight:600;padding:10px 13px;border-radius:8px;white-space:nowrap;transition:.18s}
        .site-links a:hover,.site-links a[aria-current=page]{color:#fff;background:rgba(255,71,87,.15)}
        @media(max-width:600px){.site-header{margin-bottom:20px}.site-nav{display:block;padding:9px 0}.site-brand{display:block;font-size:18px;margin:0 0 6px 4px}.site-links{overflow-x:auto;scrollbar-width:none}.site-links::-webkit-scrollbar{display:none}.site-links a{font-size:13px;padding:9px 11px}}
    </style>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
    <header class="site-header"><nav class="site-nav" aria-label="Navigasi utama">
        <a class="site-brand" href="index.html">Manga4indo</a>
        <div class="site-links">
            <a href="index.html" data-page="home">Home</a>
            <a href="list.html" data-page="daftar">Daftar Manga</a>
            <a href="index.html#terbaru" data-page="terbaru">Terbaru</a>
        </div>
    </nav></header>

    <div class="container">
        <h1>Manga4indo</h1>
        <p class="subtitle">Baca Manga, Manhwa, Komik, Webtoon Bahasa Indonesia</p>
        
        <div id="loading-status" class="loading">Memuat katalog komik...</div>
        <span id="terbaru"></span><span id="daftar-manga"></span><div class="manga-grid" id="manga-container"></div>
    </div>

    <script>
        // URL CSV asli dari Google Sheet Anda
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTTChrIxX7wKFv1mQFcDdKRJ7OwBXyw0q-UDJLMn4t-YYn6olZcJhkvYDEZDo-yl0RWS5rof6OJvui/pub?gid=0&single=true&output=csv'; 

        function parseCSV(text) {
            const rows = [];
            let row = [], value = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i], next = text[i + 1];
                if (char === '"' && quoted && next === '"') { value += '"'; i++; }
                else if (char === '"') quoted = !quoted;
                else if (char === ',' && !quoted) { row.push(value.trim()); value = ''; }
                else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(value.trim());
                    if (row.some(cell => cell !== '')) rows.push(row);
                    row = []; value = '';
                } else value += char;
            }
            if (value || row.length) { row.push(value.trim()); rows.push(row); }
            return rows;
        }

        fetch(csvUrl)
            .then(res => {
                if (!res.ok) throw new Error(`Google Sheet merespons ${res.status}`);
                return res.text();
            })
            .then(csvText => {
                const rows = parseCSV(csvText);
                const container = document.getElementById('manga-container');
                document.getElementById('loading-status').style.display = 'none';

                // Ambil posisi berdasarkan nama header agar kolom deskripsi tidak terbaca sebagai judul/cover.
                const headers = (rows[0] || []).map(header => header.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
                const findColumn = patterns => headers.findIndex(header => patterns.some(pattern => pattern.test(header)));
                const keyIndex = findColumn([/mangakey/, /^key$/, /slug/]);
                const titleIndex = findColumn([/judul/, /title/, /nama manga/, /^manga$/]);
                const coverIndex = findColumn([/cover/, /sampul/, /gambar/]);
                const fallback = (index, defaultIndex) => index >= 0 ? index : defaultIndex;

                rows.slice(1).forEach(columns => {
                    const key = columns[fallback(keyIndex, 0)] || '';
                    const judul = columns[fallback(titleIndex, 1)] || '';
                    const cover = columns[fallback(coverIndex, 3)] || '';
                    if (!key || !judul) return;

                    const card = document.createElement('a');
                    card.href = `manga.html?title=${encodeURIComponent(key)}`;
                    card.className = 'manga-card';

                    const coverBox = document.createElement('div');
                    coverBox.className = 'home-cover-box';
                    const placeholder = document.createElement('span');
                    placeholder.className = 'home-cover-placeholder';
                    placeholder.textContent = 'Cover belum tersedia';
                    coverBox.appendChild(placeholder);

                    if (cover) {
                        const image = document.createElement('img');
                        const coverPath = cover.split('/').map(encodeURIComponent).join('/');
                        image.src = `covers/${coverPath}`;
                        image.alt = `Sampul ${judul}`;
                        image.addEventListener('load', () => placeholder.remove());
                        image.addEventListener('error', () => image.remove());
                        coverBox.appendChild(image);
                    }

                    const title = document.createElement('h3');
                    title.textContent = judul;
                    const link = document.createElement('span');
                    link.textContent = 'Lihat Chapter →';
                    card.append(coverBox, title, link);
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error("Gagal memuat CSV: ", err);
                document.getElementById('loading-status').innerText = "Gagal memuat katalog manga.";
            });
    </script>
<script>
const f=location.pathname.split('/').pop()||'index.html';let p='home';if(f==='list.html'||f==='manga.html'||f==='baca.html')p='daftar';if(location.hash==='#terbaru')p='terbaru';document.querySelectorAll('.site-links a').forEach(a=>{if(a.dataset.page===p)a.setAttribute('aria-current','page')});
</script>
</body>
</html>
